<!doctype html>
<!-- Trucks of Earth: a video on the vehicle's navigation screen (career.lua videoToScreen). ?src=<file or link>&t=<s>
     &ret=<the page before>. Plays muted (the sound: the radio helper) and follows the video app's clock:
     window.ffSync(t, playing) – career.lua videoScreenSync, every 2 s; window.ffLoad(src, t) – another video;
     window.ffBack() – back to the page before (BeamNG.Earth's map or the stock navigator). The navigator's own calls
     (map.*) are swallowed here. A livestream (.m3u8 – the radio helper's http://127.0.0.1:47811/live.m3u8) plays with
     hls.js at its live edge; there t < 0 (no jumping). -->
<html><head><meta charset="utf-8"><title>Video</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}video{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:contain;background:#000}
#live{position:absolute;left:8px;top:8px;padding:2px 7px;border-radius:4px;background:#c4302b;color:#fff;font:700 13px sans-serif;display:none}</style>
<script src="hls.min.js"></script>
</head><body>
<video id="v" autoplay playsinline muted></video>
<div id="live">● LIVE</div>
<script>
(function () {
  var q = new URLSearchParams(location.search), ret = q.get('ret')
  var noop = function () {}
  window.map = { updateData: noop, setData: noop, setBootscreenImage: noop }
  var hls = null
  function dropHls() { if (hls) { try { hls.destroy() } catch (e) {} hls = null } }
  window.ffBack = function () { dropHls(); if (ret) { location.replace(ret) } }
  var v = document.getElementById('v'), badge = document.getElementById('live')
  v.muted = true
  function seek(t) { try { if (isFinite(t) && t >= 0 && Math.abs(v.currentTime - t) > 0.6) { v.currentTime = t } } catch (e) {} }
  window.ffLoad = function (src, t) {
    dropHls()
    var live = /\.m3u8(\?|$)/i.test(src || '')
    badge.style.display = live ? 'block' : 'none'
    if (live && window.Hls && window.Hls.isSupported()) {
      hls = new window.Hls({ liveSyncDurationCount: 3, maxBufferLength: 20, backBufferLength: 10 })
      hls.loadSource(src)
      hls.attachMedia(v)
      hls.on(window.Hls.Events.MANIFEST_PARSED, function () { v.play().catch(noop) })
      // (a hiccup of the stream: on again from the live edge)
      hls.on(window.Hls.Events.ERROR, function (ev, d) { if (d && d.fatal) { setTimeout(function () { window.ffLoad(src, -1) }, 3000) } })
      return
    }
    v.src = src
    v.addEventListener('loadedmetadata', function once() { v.removeEventListener('loadedmetadata', once); seek(+t || 0); v.play().catch(noop) })
  }
  window.ffSync = function (t, playing) {
    if (!hls) { seek(+t) }
    if (playing && v.paused) { v.play().catch(noop) }
    if (!playing && !v.paused) { v.pause() }
  }
  window.ffLoad(q.get('src') || '', +(q.get('t') || 0))
})()
</script>
</body></html>
