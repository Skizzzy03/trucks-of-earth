<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Wie die Verkehrs-KI mit jedem Test besser wird</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151b24"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="960" height="460" rx="18" fill="url(#bg)"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#e6edf3">Jeder Test macht den Verkehr klüger</text>
  <text x="480" y="56" text-anchor="middle" font-size="12.5" fill="#8b98a8">Messen im Spiel, nachrechnen im digitalen Zwilling, erst dann zurück ins Spiel</text>

  <!-- the loop -->
  <ellipse id="loop" cx="480" cy="250" rx="300" ry="140" fill="none" stroke="#2c3542" stroke-width="3" stroke-dasharray="10 8">
    <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="1.2s" repeatCount="indefinite"/>
  </ellipse>
  <path id="orbit" d="M780,250 A300,140 0 1,1 180,250 A300,140 0 1,1 780,250" fill="none"/>
  <circle r="9" fill="#ffb12e">
    <animateMotion dur="8s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion>
  </circle>
  <circle r="5" fill="#ffd166" opacity="0.6">
    <animateMotion dur="8s" begin="-0.25s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion>
  </circle>

  <!-- four stations -->
  <g filter="url(#soft)">
    <rect x="380" y="82" width="200" height="72" rx="14" fill="#1a2230" stroke="#3ad38b" stroke-width="2"/>
    <rect x="690" y="214" width="200" height="72" rx="14" fill="#1a2230" stroke="#b58cff" stroke-width="2"/>
    <rect x="380" y="346" width="200" height="72" rx="14" fill="#1a2230" stroke="#4d9bff" stroke-width="2"/>
    <rect x="70" y="214" width="200" height="72" rx="14" fill="#1a2230" stroke="#ffb12e" stroke-width="2"/>
  </g>
  <g text-anchor="middle">
    <text x="480" y="112" font-size="15.5" font-weight="700" fill="#3ad38b">1 · Spieltest</text>
    <text x="480" y="134" font-size="11.5" fill="#8b98a8">36 Minuten Vollautomatik</text>
    <text x="480" y="148" font-size="11.5" fill="#8b98a8">Strg+Umschalt+V</text>

    <text x="790" y="244" font-size="15.5" font-weight="700" fill="#b58cff">2 · Verkehrslabor</text>
    <text x="790" y="266" font-size="11.5" fill="#8b98a8">Black Box, Beinahe-Unfälle,</text>
    <text x="790" y="280" font-size="11.5" fill="#8b98a8">Abstände, Bildrate</text>

    <text x="480" y="376" font-size="15.5" font-weight="700" fill="#4d9bff">3 · Digitaler Zwilling</text>
    <text x="480" y="398" font-size="11.5" fill="#8b98a8">echtes Straßennetz, echte KI,</text>
    <text x="480" y="412" font-size="11.5" fill="#8b98a8">Dutzende Fahrten in Minuten</text>

    <text x="170" y="244" font-size="15.5" font-weight="700" fill="#ffb12e">4 · Verbessern</text>
    <text x="170" y="266" font-size="11.5" fill="#8b98a8">Ursache finden, beheben,</text>
    <text x="170" y="280" font-size="11.5" fill="#8b98a8">Hunderte Prüfungen grün</text>
  </g>

  <!-- the middle: a little live readout -->
  <g text-anchor="middle">
    <text x="480" y="226" font-size="13" fill="#8b98a8">Notbremsungen je 10 Minuten</text>
    <text x="480" y="270" font-size="38" font-weight="800" fill="#e6edf3">
      <tspan>82</tspan>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.3;0.33;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="480" y="270" font-size="38" font-weight="800" fill="#ffd166" opacity="0">
      <tspan>24</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.36;0.63;0.66;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="480" y="270" font-size="38" font-weight="800" fill="#3ad38b" opacity="0">
      <tspan>11</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.69;0.97;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="480" y="294" font-size="11.5" fill="#5d6a7a">aus echten Testfahrten im Spiel</text>
  </g>
  <text x="480" y="446" text-anchor="middle" font-size="11.5" fill="#5d6a7a">Trucks of Earth · trafficlab.lua · tools/sims/sim_twin.js</text>
</svg>
