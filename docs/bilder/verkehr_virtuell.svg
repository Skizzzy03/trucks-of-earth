<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Virtueller Verkehr: Punkt, Platzhalter, echtes Auto</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151b24"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ad38b" stop-opacity="0"/><stop offset="0.5" stop-color="#3ad38b" stop-opacity="0.16"/><stop offset="1" stop-color="#3ad38b" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="960" height="430" rx="18" fill="url(#bg)"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#e6edf3">Viel Verkehr, wenig Rechenarbeit</text>
  <text x="480" y="56" text-anchor="middle" font-size="12.5" fill="#8b98a8">Nur die Autos nah am LKW haben Physik. Weiter weg sind sie Modelle, außer Sicht nur Punkte auf dem Straßennetz.</text>

  <!-- zones -->
  <rect x="100" y="120" width="760" height="170" fill="#4d9bff" opacity="0.05"/>
  <rect x="340" y="120" width="280" height="170" fill="url(#near)"/>
  <g stroke="#3a4556" stroke-width="1.5" stroke-dasharray="3 5">
    <line x1="100" y1="104" x2="100" y2="300"/><line x1="860" y1="104" x2="860" y2="300"/>
    <line x1="340" y1="104" x2="340" y2="300"/><line x1="620" y1="104" x2="620" y2="300"/>
  </g>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <text x="50" y="100" fill="#4d9bff">virtuell</text><text x="910" y="100" fill="#4d9bff">virtuell</text>
    <text x="220" y="100" fill="#c9d4e0">Platzhalter</text><text x="740" y="100" fill="#c9d4e0">Platzhalter</text>
    <text x="480" y="100" fill="#3ad38b">echt</text>
  </g>

