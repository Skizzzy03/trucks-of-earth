  <!-- the truck -->
  <g transform="translate(480 261)">
    <rect x="-58" y="-10" width="86" height="20" rx="3" fill="#5d6a7a"/>
    <rect x="32" y="-10" width="26" height="20" rx="4" fill="#ffb12e"/>
    <rect x="48" y="-8" width="7" height="16" rx="2" fill="#0d1117" opacity="0.55"/>
  </g>
  <text x="480" y="300" text-anchor="middle" font-size="11.5" fill="#ffb12e">dein LKW</text>

  <!-- legend -->
  <g transform="translate(80 336)" font-size="12.5" fill="#c9d4e0">
    <circle cx="8" cy="14" r="5" fill="#4d9bff"/>
    <text x="24" y="11" font-weight="700" fill="#e6edf3">Virtuell</text>
    <text x="24" y="28" fill="#8b98a8">ein Punkt auf dem Netz, fährt mit Abstand,</text>
    <text x="24" y="44" fill="#8b98a8">Spurwechsel und Stau – kostet fast nichts</text>
    <rect x="276" y="6" width="30" height="15" rx="5" fill="none" stroke="#e6edf3" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="316" y="11" font-weight="700" fill="#e6edf3">Platzhalter</text>
    <text x="316" y="28" fill="#8b98a8">das echte Modell, aber ohne Physik,</text>
    <text x="316" y="44" fill="#8b98a8">jedes Bild weitergeschoben, bis etwa 480 m</text>
    <rect x="566" y="6" width="30" height="15" rx="5" fill="#3ad38b"/>
    <text x="606" y="11" font-weight="700" fill="#e6edf3">Echt</text>
    <text x="606" y="28" fill="#8b98a8">volle Physik, eigener Fahrer, Notbremse –</text>
    <text x="606" y="44" fill="#8b98a8">an derselben Stelle, mit demselben Tempo</text>
  </g>
  <text x="480" y="414" text-anchor="middle" font-size="11.5" fill="#5d6a7a">Trucks of Earth · virtual.lua · Wer sich entfernt, schläft wieder ein – wer näherkommt, wird echt</text>
</svg>