<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Die Verkehrs-KI von Trucks of Earth: wer mit wem spricht</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151b24"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb12e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffb12e" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a4556"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="960" height="560" rx="18" fill="url(#bg)"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#e6edf3">So spricht der Verkehr miteinander</text>
  <text x="480" y="56" text-anchor="middle" font-size="12.5" fill="#8b98a8">Jeder Punkt ist eine Nachricht: alle 0,5 Sekunden schaut die Leitstelle auf jedes Auto</text>

  <!-- the wires -->
  <g fill="none" stroke="#2c3542" stroke-width="2.2" marker-end="url(#arr)">
    <path id="pVirt" d="M290,118 C350,130 380,190 418,228"/>
    <path id="pFlow" d="M670,118 C610,130 580,190 542,228"/>
    <path id="pEarth" d="M232,288 L366,288"/>
    <path id="pTruck" d="M232,452 C300,452 340,380 400,342"/>
    <path id="pD1" d="M592,262 L726,232"/>
    <path id="pD2" d="M592,288 L726,288"/>
    <path id="pD3" d="M592,314 L726,344"/>
    <path id="pBack" d="M726,372 C680,392 640,360 596,330"/>
    <path id="pBeam" d="M560,342 C600,420 670,462 726,462"/>
    <path id="pHaz" d="M452,342 L384,428"/>
    <path id="pLab" d="M512,342 L572,428"/>
  </g>

  <!-- labels on the wires -->
  <g font-size="11.5" fill="#8b98a8">
    <text x="300" y="178">einsetzen ·</text>
    <text x="300" y="192">schlafen legen</text>
    <text x="606" y="178">Stau-Tempo,</text>
    <text x="606" y="192">Verkehrsmenge</text>
    <text x="246" y="278">Straßennetz, Boden</text>
    <text x="246" y="400">Position, Tempo,</text>
    <text x="246" y="414">Autodrive</text>
    <text x="608" y="240" transform="rotate(-12 608 240)">Tempo-Deckel</text>
    <text x="616" y="282">Spur, Abstand</text>
    <text x="640" y="318" transform="rotate(12 640 318)">Ausweichen</text>
    <text x="636" y="398">Zustand alle 2 s</text>
    <text x="612" y="448">wo nötig</text>
    <text x="340" y="384">Wracks,</text>
    <text x="340" y="398">Gefahren</text>
    <text x="560" y="384">Messwerte</text>
  </g>

  <!-- the control room in the middle -->
  <circle cx="480" cy="288" r="120" fill="url(#glow)">
    <animate attributeName="r" values="105;128;105" dur="3s" repeatCount="indefinite"/>
  </circle>
  <g filter="url(#soft)">
    <rect x="368" y="232" width="224" height="112" rx="16" fill="#1f2632" stroke="#ffb12e" stroke-width="2.5"/>
  </g>
  <text x="480" y="272" text-anchor="middle" font-size="19" font-weight="700" fill="#ffb12e">Leitstelle</text>
  <text x="480" y="294" text-anchor="middle" font-size="12.5" fill="#c9d4e0">trafficai.lua</text>
  <text x="480" y="318" text-anchor="middle" font-size="11.5" fill="#8b98a8">Notbremse · Überholen · Sperren</text>

  <!-- the boxes round it -->
  <g filter="url(#soft)">
    <rect x="70" y="72" width="220" height="64" rx="12" fill="#1a2230" stroke="#4d9bff" stroke-width="2"/>
    <rect x="670" y="72" width="220" height="64" rx="12" fill="#1a2230" stroke="#4d9bff" stroke-width="2"/>
    <rect x="30" y="256" width="202" height="64" rx="12" fill="#1a2230" stroke="#3ad38b" stroke-width="2"/>
    <rect x="30" y="420" width="202" height="64" rx="12" fill="#1a2230" stroke="#3ad38b" stroke-width="2"/>
    <rect x="726" y="208" width="204" height="180" rx="12" fill="#1a2230" stroke="#ffb12e" stroke-width="2"/>
    <rect x="726" y="430" width="204" height="64" rx="12" fill="#1a2230" stroke="#6b7685" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="270" y="430" width="180" height="64" rx="12" fill="#1a2230" stroke="#ff6b6b" stroke-width="2"/>
    <rect x="510" y="430" width="180" height="64" rx="12" fill="#1a2230" stroke="#b58cff" stroke-width="2"/>
  </g>
  <g font-size="15" font-weight="700" fill="#e6edf3" text-anchor="middle">
    <text x="180" y="100">Virtueller Verkehr</text>
    <text x="780" y="100">Stau &amp; Menge</text>
    <text x="131" y="284">BeamNG.Earth</text>
    <text x="131" y="448">Dein LKW</text>
    <text x="828" y="232">Eigener Fahrer</text>
    <text x="828" y="458" fill="#aab4c0">BeamNG-KI</text>
    <text x="360" y="458">Gefahren</text>
    <text x="600" y="458">Verkehrslabor</text>
  </g>
  <g font-size="11.5" fill="#8b98a8" text-anchor="middle">
    <text x="180" y="120">virtual.lua · Punkte auf dem Netz</text>
    <text x="780" y="120">trafficflow.lua · Staus mit Grund</text>
    <text x="131" y="304">echte Straßen der Welt</text>
    <text x="131" y="468">fährt selbst oder im Autodrive</text>
    <text x="828" y="478">übernimmt nur im Notfall</text>
    <text x="360" y="478">hazards.lua · lernt Stellen</text>
    <text x="600" y="478">trafficlab.lua · misst alles</text>
  </g>

  <!-- three cars, each with its own driver -->
  <g font-size="11" fill="#c9d4e0">
    <g>
      <rect x="742" y="246" width="172" height="34" rx="8" fill="#232c3a"/>
      <rect x="752" y="255" width="26" height="16" rx="4" fill="#ffb12e"/>
      <text x="788" y="267">driver.lua · ruhig, 2,1 s</text>
    </g>
    <g>
      <rect x="742" y="288" width="172" height="34" rx="8" fill="#232c3a"/>
      <rect x="752" y="297" width="26" height="16" rx="4" fill="#4d9bff"/>
      <text x="788" y="309">driver.lua · flott, 1,0 s</text>
    </g>
    <g>
      <rect x="742" y="330" width="172" height="34" rx="8" fill="#232c3a"/>
      <rect x="752" y="339" width="26" height="16" rx="4" fill="#3ad38b"/>
      <text x="788" y="351">driver.lua · im Pulk</text>
    </g>
  </g>

  <!-- the messages -->
  <g>
    <circle r="5" fill="#4d9bff"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#pVirt"/></animateMotion></circle>
    <circle r="5" fill="#4d9bff"><animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#pVirt"/></animateMotion></circle>
    <circle r="5" fill="#4d9bff"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#pFlow"/></animateMotion></circle>
    <circle r="5" fill="#3ad38b"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#pEarth"/></animateMotion></circle>
    <circle r="5" fill="#3ad38b"><animateMotion dur="2s" begin="0.4s" repeatCount="indefinite"><mpath href="#pTruck"/></animateMotion></circle>
    <circle r="5" fill="#ffb12e"><animateMotion dur="1.4s" repeatCount="indefinite"><mpath href="#pD1"/></animateMotion></circle>
    <circle r="5" fill="#ffb12e"><animateMotion dur="1.4s" begin="0.45s" repeatCount="indefinite"><mpath href="#pD2"/></animateMotion></circle>
    <circle r="5" fill="#ffb12e"><animateMotion dur="1.4s" begin="0.9s" repeatCount="indefinite"><mpath href="#pD3"/></animateMotion></circle>
    <circle r="4" fill="#e6edf3"><animateMotion dur="2.4s" begin="0.7s" repeatCount="indefinite"><mpath href="#pBack"/></animateMotion></circle>
    <circle r="4" fill="#8b98a8"><animateMotion dur="4s" begin="1.5s" repeatCount="indefinite"><mpath href="#pBeam"/></animateMotion></circle>
    <circle r="5" fill="#ff6b6b"><animateMotion dur="3s" begin="0.2s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#pHaz"/></animateMotion></circle>
    <circle r="5" fill="#b58cff"><animateMotion dur="2.8s" begin="1s" repeatCount="indefinite"><mpath href="#pLab"/></animateMotion></circle>
  </g>

  <text x="480" y="536" text-anchor="middle" font-size="11.5" fill="#5d6a7a">Trucks of Earth · Verkehrs-KI 1.0.5 · alles in Lua, ohne fremde Bibliotheken</text>
</svg>
